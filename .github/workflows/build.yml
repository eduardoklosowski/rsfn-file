name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-amd64:
    name: Linux amd64 Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup rust
        run: rustup update 1.89 && rustup default 1.89

      - name: Build
        run: |
          mkdir dist
          cargo build --package=rsfn-file --bin=rsfnfile --release
          cp target/release/rsfnfile dist/rsfnfile

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-amd64-build
          path: dist
          if-no-files-found: error

  linux-arm64:
    name: Linux arm64 Build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup rust
        run: rustup update 1.89 && rustup default 1.89

      - name: Build
        run: |
          mkdir dist
          cargo build --package=rsfn-file --bin=rsfnfile --release
          cp target/release/rsfnfile dist/rsfnfile

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-build
          path: dist
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64 Build
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup rust
        run: rustup update 1.89 && rustup default 1.89

      - name: Build
        run: |
          mkdir dist
          cargo build --package=rsfn-file --bin=rsfnfile --release
          cp target/release/rsfnfile dist/rsfnfile

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-build
          path: dist
          if-no-files-found: error

  windows-amd64:
    name: Windows amd64 Build
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup rust
        run: rustup update 1.89 && rustup default 1.89

      - name: Build
        run: |
          md dist
          cargo build --package=rsfn-file --bin=rsfnfile --release
          copy target/release/rsfnfile.exe dist/rsfnfile.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-amd64-build
          path: dist
          if-no-files-found: error
